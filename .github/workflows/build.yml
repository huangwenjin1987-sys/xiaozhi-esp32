name: Build 小明同学 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP-IDF project
        uses: espressif/build-esp-idf-projects-action@v1
        with:
          sdkconfig: sdkconfig.defaults.esp32s3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware
          path: build/*.bin
