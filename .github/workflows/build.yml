name: Build 小明同学 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          . /opt/esp/idf/export.sh
          command -v idf.py
          idf.py --version
          python scripts/release.py waveshare/esp32-s3-touch-lcd-1.83

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware
          path: releases/*.zip
          if-no-files-found: error
